<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerManager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header>
    <h1>电源与充电</h1>
    <span id="agent" class="pill"><span class="dot"></span><span id="agent-text">…</span><span id="agent-start" class="link hidden">启动</span></span>
  </header>

  <section class="card mode-card" id="mode-card">
    <div class="card-head">
      <h2>模式</h2>
      <button type="button" class="toggle" id="rules-toggle">规则与电源模式</button>
    </div>
    <div class="mode-layout">
      <div class="mode-left">
        <div class="tiles">
          <div class="tile" id="t-normal"><b>普通</b><span>合盖 1 分钟后睡</span></div>
          <div class="tile" id="t-run"><b>保持运行</b><span>跑实验、通勤：插电不睡，合盖继续跑</span></div>
        </div>
        <div class="runbar hidden" id="runbar">
          <span class="left num" id="run-left"></span>
          <span class="row"><span class="faint">时长</span><span class="chips" id="hours"></span></span>
        </div>
        <div class="alertbar hidden" id="forced-sleep-bar">
          主动睡眠已触发：2 分钟内未入睡将自动休眠（开盖活动可中止）
        </div>
      </div>
      <div class="rules-panel">
        <dl class="kv" id="rules"></dl>
        <div class="rules-foot">
          <span>Esc 关闭 · F5 刷新</span>
          <button type="button" class="text-btn" id="open-data-dir">打开数据目录</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card battery-card">
    <div>
      <div class="row spread">
        <h2 style="margin:0">电池</h2>
        <div class="read-actions">
          <span class="read-wrap hidden" id="read-wrap">
            <span class="read-badge num" id="read-at"></span>
            <span class="read-tip">事件触发：插拔电、醒来、电量每变 5%、冲高到点</span>
          </span>
          <button type="button" class="mini-btn" id="b-refresh-ec" title="按需拉起 EC 任务刷新温度、功耗与阈值读数">刷新读数</button>
        </div>
      </div>
      <div class="row" style="gap:1.1rem; margin-top:.6rem; align-items:flex-end">
        <div class="big num" id="pct"></div>
        <div style="padding-bottom:.25rem">
          <div class="flow" id="flow"></div>
          <div class="faint" id="hw"></div>
        </div>
      </div>
      <div class="meter"><div class="fill" id="fill"></div><div class="band" id="band"><i id="band-label"></i></div></div>
      <div class="scale num"><span>0</span><span>50</span><span>100</span></div>
      <dl class="stats">
        <div class="stat"><dt>电池温度</dt><dd class="num" id="s-temp">–</dd></div>
        <div class="stat"><dt>整机功耗</dt><dd class="num" id="s-power">–</dd></div>
        <div class="stat"><dt>充电电流</dt><dd class="num" id="s-ma">–</dd></div>
        <div class="stat"><dt>最热传感器</dt><dd class="num" id="s-hot">–</dd></div>
        <div class="stat wide">
          <div class="pm-boxes">
            <div class="pm-box" id="pm-ac"><span>插电</span><b id="pm-ac-v">–</b></div>
            <div class="pm-box" id="pm-dc"><span>用电池</span><b id="pm-dc-v">–</b></div>
          </div>
        </div>
      </dl>
      <div class="note" id="note"></div>
    </div>
    <hr>

    <div id="boost-off">
      <div class="boost-head"><b>临时冲高</b><span class="faint">出门前多充一点，到时自动回到 75%–80%</span></div>
      <div class="field">
        <label>充到</label>
        <div class="ctrl">
          <div class="slider-row"><input type="range" id="r-target" min="85" max="100" step="1"><span class="slider-val num" id="v-target"></span></div>
          <span class="chips" id="b-target"></span>
        </div>
      </div>
      <div class="field">
        <label>充到后插电保持</label>
        <div class="ctrl">
          <div class="slider-row"><input type="range" id="r-hold" min="15" max="180" step="5"><span class="slider-val num" id="v-hold"></span></div>
          <span class="chips" id="b-hold"></span>
        </div>
      </div>
      <div class="field">
        <label>最长</label>
        <div class="ctrl">
          <div class="slider-row"><input type="range" id="r-max" min="1" max="12" step="0.5"><span class="slider-val num" id="v-max"></span></div>
          <span class="chips" id="b-max"></span>
        </div>
      </div>
      <div class="row spread" style="margin-top:.55rem">
        <span class="faint">拔电出门也会回到 75%–80%</span>
        <button class="btn" id="b-go">开始冲高</button>
      </div>
    </div>
    <div id="boost-on" class="boosting hidden">
      <div class="row spread"><b id="bo-title"></b><span class="faint num" id="bo-deadline"></span></div>
      <div class="progress"><div id="bo-bar"></div></div>
      <div class="faint" id="bo-text"></div>
    </div>
  </section>
  <footer class="mock-bar hidden" id="mock-bar">
    <span>离线预览模式（Mock 桥接）</span>
    <span class="chips" id="mock-presets"></span>
  </footer>
</main>
<div class="toast" id="toast"></div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
