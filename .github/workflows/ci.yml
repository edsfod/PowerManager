name: CI

on:
  push:
    branches: ['**']   # 只在推分支时运行；推 tag 不再重复跑同一提交
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check doc references
        run: python scripts/verify_doc_references.py

      - name: Build and test
        run: dotnet test PowerManager.sln --nologo
