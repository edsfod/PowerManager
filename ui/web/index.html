<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerManager</title>
<style>
:root {
  --bg: #f3f3f3; --card: #ffffff; --line: rgba(0,0,0,.07); --line2: rgba(0,0,0,.05);
  --ink: #1b1b1b; --ink2: #5d5d5d; --ink3: #8b8b8b;
  --accent: #0f6cbd; --accent-ink: #ffffff; --accent-soft: #eaf2fb; --accent-line: #b4d3f2;
  --chip: #f7f7f7; --chip-hover: #efefef; --track: #ececec;
  --green: #107c10; --amber: #9d5d00; --red: #c42b1c; --band: rgba(15,108,189,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.03);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #202020; --card: #2b2b2b; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.06);
    --ink: #f3f3f3; --ink2: #c5c5c5; --ink3: #9a9a9a;
    --accent: #4cc2ff; --accent-ink: #00243a; --accent-soft: rgba(76,194,255,.12); --accent-line: rgba(76,194,255,.45);
    --chip: #333333; --chip-hover: #3c3c3c; --track: #3a3a3a;
    --green: #6ccb5f; --amber: #fcb35b; --red: #ff99a4; --band: rgba(76,194,255,.22);
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { font-size: clamp(14px, calc(10px + .45vw), 17px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  font-size: 1rem; line-height: 1.45; -webkit-font-smoothing: antialiased;
  user-select: none; cursor: default;
}
.num { font-variant-numeric: tabular-nums; }
main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.25rem 2rem; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
h1 { font-size: 1.45rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
.pill { display: inline-flex; align-items: center; gap: .45rem; font-size: .86rem; color: var(--ink2);
        padding: .3rem .75rem; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--green); }
.pill.off .dot { background: var(--red); }
.link { color: var(--accent); cursor: pointer; font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: .6rem; box-shadow: var(--shadow);
        padding: 1.15rem 1.25rem; margin-bottom: .9rem; }
.card h2 { font-size: .8rem; font-weight: 600; color: var(--ink3); letter-spacing: .06em; margin: 0 0 .8rem; }
.row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.muted { color: var(--ink2); }
.faint { color: var(--ink3); font-size: .86rem; }

/* mode tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.tile { border: 1px solid var(--line); border-radius: .5rem; padding: .8rem .95rem; cursor: pointer;
        background: var(--chip); transition: background .12s, border-color .12s; }
.tile:hover { background: var(--chip-hover); }
.tile b { display: block; font-weight: 600; font-size: 1.02rem; }
.tile span { display: block; font-size: .84rem; color: var(--ink2); margin-top: .15rem; }
.tile.on { background: var(--accent-soft); border-color: var(--accent); }
.tile.on b { color: var(--accent); }
.runbar { margin-top: .8rem; padding: .7rem .9rem; border-radius: .5rem; background: var(--accent-soft);
          display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.runbar .left { font-weight: 600; }

/* chips */
.chips { display: inline-flex; gap: .3rem; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: .4rem;
        padding: .22rem .7rem; font: inherit; font-size: .88rem; cursor: pointer; }
.chip:hover { background: var(--chip-hover); }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }

details { margin-top: .9rem; }
summary { cursor: pointer; color: var(--ink2); font-size: .86rem; list-style: none; display: inline-flex; gap: .35rem; align-items: center; }
summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 1rem; line-height: 1; }
details[open] summary::before { transform: rotate(90deg); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; margin-top: .6rem; font-size: .88rem; }
.kv dt { color: var(--ink3); }
.kv dd { margin: 0; color: var(--ink2); }

/* battery */
.big { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-size: 3.2rem; font-weight: 600;
       line-height: 1; letter-spacing: -.02em; }
.big small { font-size: 1.5rem; font-weight: 500; color: var(--ink2); margin-left: .1rem; }
.flow { font-size: 1.02rem; }
.meter { position: relative; margin: 1.6rem 0 .35rem; height: .55rem; border-radius: 999px; background: var(--track); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--green); }
.meter .band { position: absolute; top: -.35rem; bottom: -.35rem; border: 1.5px solid var(--accent); border-radius: .3rem;
               background: var(--band); }
.meter .band i { position: absolute; bottom: calc(100% + .2rem); left: 50%; transform: translateX(-50%);
                 font-style: normal; font-size: .76rem; color: var(--accent); white-space: nowrap; font-weight: 600; }
.scale { display: flex; justify-content: space-between; font-size: .74rem; color: var(--ink3); margin-top: .45rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-top: 1rem; }
.stat { background: var(--chip); border-radius: .45rem; padding: .55rem .75rem; }
.stat dt { font-size: .76rem; color: var(--ink3); }
.stat dd { margin: .1rem 0 0; font-size: 1.12rem; font-weight: 600; }
.note { margin-top: .8rem; font-size: .86rem; color: var(--ink3); }
.note.warn { color: var(--amber); }
hr { border: 0; border-top: 1px solid var(--line2); margin: 1.15rem 0; }

.boost-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .75rem; }
.boost-head b { font-weight: 600; font-size: 1.02rem; }
.field { display: grid; grid-template-columns: 7.5rem 1fr; align-items: center; gap: .5rem; margin: .45rem 0; }
.field label { color: var(--ink2); font-size: .9rem; }
.btn { border: 0; border-radius: .4rem; padding: .5rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
       background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .55; cursor: default; }
.boosting { background: var(--accent-soft); border-radius: .5rem; padding: .85rem 1rem; }
.progress { height: .35rem; border-radius: 999px; background: var(--track); margin: .6rem 0 .45rem; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 999px; }

.toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); background: var(--ink); color: var(--bg);
         padding: .55rem 1rem; border-radius: .45rem; font-size: .88rem; opacity: 0; transition: opacity .2s; pointer-events: none;
         max-width: 90vw; }
.toast.show { opacity: .95; }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink3); }
</style>
</head>
<body>
<main>
  <header>
    <h1>电源与充电</h1>
    <span id="agent" class="pill"><span class="dot"></span><span id="agent-text">…</span><span id="agent-start" class="link hidden">启动</span></span>
  </header>

  <section class="card">
    <h2>模式</h2>
    <div class="tiles">
      <div class="tile" id="t-normal"><b>普通</b><span>合盖 1 分钟后睡</span></div>
      <div class="tile" id="t-run"><b>保持运行</b><span>跑实验、通勤：插电不睡，合盖继续跑</span></div>
    </div>
    <div class="runbar hidden" id="runbar">
      <span class="left num" id="run-left"></span>
      <span class="row"><span class="faint">时长</span><span class="chips" id="hours"></span></span>
    </div>
    <details>
      <summary>规则与电源模式</summary>
      <dl class="kv" id="rules"></dl>
    </details>
  </section>

  <section class="card">
    <div class="row spread"><h2 style="margin:0">电池</h2><span class="faint num" id="read-at"></span></div>
    <div class="row" style="gap:1.1rem; margin-top:.6rem; align-items:flex-end">
      <div class="big num" id="pct"></div>
      <div style="padding-bottom:.25rem">
        <div class="flow" id="flow"></div>
        <div class="faint" id="hw"></div>
      </div>
    </div>
    <div class="meter"><div class="fill" id="fill"></div><div class="band" id="band"><i id="band-label"></i></div></div>
    <div class="scale num"><span>0</span><span>50</span><span>100</span></div>
    <dl class="stats">
      <div class="stat"><dt>电池温度</dt><dd class="num" id="s-temp">–</dd></div>
      <div class="stat"><dt>整机功耗</dt><dd class="num" id="s-power">–</dd></div>
      <div class="stat"><dt>充电电流</dt><dd class="num" id="s-ma">–</dd></div>
    </dl>
    <div class="note" id="note"></div>
    <hr>

    <div id="boost-off">
      <div class="boost-head"><b>临时冲高</b><span class="faint">出门前多充一点，到时自动回到 75%–80%</span></div>
      <div class="field"><label>充到</label><span class="chips" id="b-target"></span></div>
      <div class="field"><label>充到后插电保持</label><span class="chips" id="b-hold"></span></div>
      <div class="field"><label>最长</label><span class="chips" id="b-max"></span></div>
      <div class="row spread" style="margin-top:.9rem">
        <span class="faint">拔电出门也会回到 75%–80%</span>
        <button class="btn" id="b-go">开始冲高</button>
      </div>
    </div>
    <div id="boost-on" class="boosting hidden">
      <div class="row spread"><b id="bo-title"></b><span class="faint num" id="bo-deadline"></span></div>
      <div class="progress"><div id="bo-bar"></div></div>
      <div class="faint" id="bo-text"></div>
    </div>

    <details>
      <summary>更多读数</summary>
      <dl class="kv" id="more"></dl>
    </details>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const api = () => window.pywebview.api;
let S = null;
const pick = { target: null, hold: null, maxh: null };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3500);
}

function chips(el, values, current, fmt, onPick) {
  el.innerHTML = '';
  for (const v of values) {
    const b = document.createElement('button');
    b.className = 'chip num' + (v == current ? ' on' : '');
    b.textContent = fmt(v);
    b.onclick = () => onPick(v);
    el.appendChild(b);
  }
}

function render(s) {
  S = s;
  // agent
  $('agent').classList.toggle('off', !s.agent);
  $('agent-text').textContent = s.agent ? '常驻运行中' : '常驻没在运行';
  $('agent-start').classList.toggle('hidden', s.agent);

  // mode
  const run = s.mode.mode === 'run';
  $('t-normal').classList.toggle('on', !run);
  $('t-run').classList.toggle('on', run);
  $('runbar').classList.toggle('hidden', !run);
  if (run) $('run-left').textContent = `还剩 ${s.mode.left}，${s.mode.until} 回到普通`;
  chips($('hours'), [2, 4, 8, 12, 24], s.mode.hours, v => `${v} 小时`, v => setMode('run', v));
  const R = run
    ? [['插电', '15 分钟关屏，不睡；合盖继续跑'], ['用电池', '5 分钟关屏，30 分钟没人操作才睡；电池到 40 °C 提前睡'],
       ['睡不下去', '2 分钟后休眠（后台忙时只能休眠）']]
    : [['合盖', '1 分钟后睡'], ['插电', '15 分钟关屏，1 小时睡'], ['用电池', '5 分钟关屏，15 分钟睡'],
       ['睡不下去', '2 分钟后休眠（后台忙时只能休眠）']];
  R.push(['电源模式', `插电 ${s.power_mode.ac}；用电池 ${s.power_mode.dc}（50% 以下自动换最佳能效）`],
         ['电源键', '不起作用（睡着时按会唤醒）']);
  $('rules').innerHTML = R.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

  // battery
  const b = s.battery;
  $('pct').innerHTML = b.pct == null ? '–' : `${b.pct}<small>%</small>`;
  $('flow').textContent = b.flow;
  $('read-at').textContent = b.read_at ? `读数 ${b.read_at}` : '';
  const [lo, hi] = b.band;
  $('hw').textContent = b.hw
    ? (b.hw[0] == lo && b.hw[1] == hi ? `充电区间 ${lo}%–${hi}%` : `充电区间 ${b.hw[0]}%–${b.hw[1]}%（应为 ${lo}%–${hi}%，下次运行改回）`)
    : '充电区间还没读到';
  const fill = $('fill');
  fill.style.width = (b.pct ?? 0) + '%';
  fill.style.background = b.pct >= 50 ? 'var(--green)' : b.pct >= 20 ? 'var(--amber)' : 'var(--red)';
  const band = $('band');
  band.style.left = lo + '%'; band.style.width = (hi - lo) + '%';
  $('band-label').textContent = `${lo}–${hi}%`;
  $('s-temp').textContent = b.temp != null ? `${b.temp.toFixed(1)} °C` : '–';
  $('s-power').textContent = b.system_w != null ? `${b.system_w} W` : '–';
  $('s-ma').textContent = b.charge_ma != null ? `${b.charge_ma} mA` : '–';
  const note = $('note');
  note.textContent = b.slow ? '充得慢：机器热或功耗高时 EC 会压低充电电流，凉下来自动放开' : b.last;
  note.classList.toggle('warn', b.slow);
  $('more').innerHTML = [
    ['最热传感器', b.hottest != null ? `${Math.round(b.hottest)} °C（CPU 满载时 90–100 °C 是正常的）` : '–'],
    ['电源模式', `插电 ${s.power_mode.ac}，用电池 ${s.power_mode.dc}`],
    ['读数', '有事才读：插拔电、醒来、电量每变 5%、冲高到点'],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

  // boost
  const bo = s.boost;
  $('boost-on').classList.toggle('hidden', !bo.active);
  $('boost-off').classList.toggle('hidden', bo.active);
  if (bo.active) {
    $('bo-title').textContent = `冲高到 ${bo.target}%`;
    $('bo-deadline').textContent = `最迟 ${bo.deadline} 回落`;
    if (bo.held != null) {
      $('bo-bar').style.width = Math.min(100, 100 * bo.held / bo.hold) + '%';
      $('bo-text').textContent = `已充到，插着电保持 ${bo.held}/${bo.hold} 分钟；拔电也会回到 75%–80%`;
    } else {
      $('bo-bar').style.width = Math.min(100, 100 * Math.max(0, (b.pct ?? 0) - lo) / Math.max(1, bo.target - lo)) + '%';
      $('bo-text').textContent = `正在充（${b.pct}%），充到后插着电保持 ${bo.hold} 分钟；拔电也会回到 75%–80%`;
    }
  } else {
    pick.target ??= s.boost_prefs.target; pick.hold ??= nearest(s.boost_prefs.hold, [30, 60, 120]);
    pick.maxh ??= nearest(s.boost_prefs.maxh, [2, 4, 8]);
    chips($('b-target'), [85, 90, 95, 100], pick.target, v => `${v}%`, v => { pick.target = v; render(S); });
    chips($('b-hold'), [30, 60, 120], pick.hold, v => `${v} 分钟`, v => { pick.hold = v; render(S); });
    chips($('b-max'), [2, 4, 8], pick.maxh, v => `${v} 小时`, v => { pick.maxh = v; render(S); });
  }
}
const nearest = (x, arr) => arr.reduce((a, b) => Math.abs(b - x) < Math.abs(a - x) ? b : a);

async function refresh() { if (window.pywebview) render(await api().get_state()); }

async function setMode(mode, hours) {
  const r = await api().set_mode(mode, hours ?? S.mode.hours);
  if (!r.ok) toast(r.msg);
  await refresh();
}

$('t-normal').onclick = () => S && S.mode.mode !== 'normal' && setMode('normal');
$('t-run').onclick = () => S && S.mode.mode !== 'run' && setMode('run');
$('agent-start').onclick = async () => { const r = await api().start_agent(); if (!r.ok) toast(r.msg); refresh(); };
$('b-go').onclick = async () => {
  const btn = $('b-go'); btn.disabled = true; btn.textContent = '正在写入 EC…';
  const r = await api().boost(pick.target, pick.hold, pick.maxh);
  btn.disabled = false; btn.textContent = '开始冲高';
  toast(r.ok ? `已开始冲高到 ${pick.target}%` : r.msg);
  refresh();
};
window.addEventListener('pywebviewready', refresh);
window.addEventListener('focus', refresh);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
